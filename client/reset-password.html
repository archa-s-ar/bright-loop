<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set New Password — Brightloop</title>
  <meta name="description" content="Set a new password for your Brightloop account." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-icon">B</div>
          <span>Brightloop</span>
        </div>
        <h1 class="auth-title">Set new password</h1>
        <p class="auth-subtitle">Choose a secure password longer than 8 characters</p>
      </div>

      <div id="auth-alert" class="auth-alert auth-alert-error" role="alert"></div>

      <form id="reset-form" novalidate>
        <input type="hidden" id="token" name="token" />

        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            class="form-control"
            placeholder="At least 9 characters"
            required
            autocomplete="new-password"
          />
          <div class="password-meter">
            <div id="password-meter-bar" class="password-meter-bar"></div>
          </div>
          <div class="password-meter-text">
            <span id="password-feedback">Must include uppercase, lowercase, & special character</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-control"
            placeholder="Re-enter new password"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          <span>Update Password</span>
        </button>
      </form>

      <div class="auth-footer">
        <a href="/login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/reset-password.js"></script>
</body>
</html>
