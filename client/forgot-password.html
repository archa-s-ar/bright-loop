<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Brightloop</title>
  <meta name="description" content="Reset your Brightloop account password." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-icon">B</div>
          <span>Brightloop</span>
        </div>
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter your email and we'll send a secure password reset link</p>
      </div>

      <div id="auth-alert" class="auth-alert auth-alert-error" role="alert"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Account Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="name@company.com"
            required
            autocomplete="email"
          />
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary btn-block">
          <span>Send Reset Link</span>
        </button>
      </form>

      <div class="auth-footer">
        Remembered your password?
        <a href="/login.html">Return to Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/forgot-password.js"></script>
</body>
</html>
