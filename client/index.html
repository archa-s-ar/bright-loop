<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brightloop — Subscription Management System</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const user = await Auth.checkSession();
        if (user && user.role) {
          window.location.href = Auth.getDashboardPath(user.role);
        } else {
          window.location.href = '/login.html';
        }
      } catch (err) {
        window.location.href = '/login.html';
      }
    });
  </script>
</head>
<body style="display: flex; align-items: center; justify-content: center; height: 100vh; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;">
  <div style="text-align: center;">
    <div class="auth-brand-icon" style="width: 52px; height: 52px; font-size: 1.6rem; margin: 0 auto 16px; background: #4f46e5; color: #fff; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-weight: 800;">
      B
    </div>
    <h2 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 8px;">Brightloop</h2>
    <p style="color: #94a3b8; font-size: 0.95rem;">Loading Subscription & Billing Management System...</p>
  </div>
</body>
</html>
