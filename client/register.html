<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer Registration — Brightloop</title>
  <meta name="description" content="Register your company account with Brightloop Subscription Management." />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card" style="max-width: 540px;">
      <div class="auth-header">
        <div class="auth-brand">
          <div class="auth-brand-icon">B</div>
          <span>Brightloop</span>
        </div>
        <h1 class="auth-title">Create Customer Account</h1>
        <p class="auth-subtitle">Get started managing products, quotes, and subscriptions</p>
      </div>

      <div id="auth-alert" class="auth-alert auth-alert-error" role="alert"></div>

      <form id="register-form" novalidate>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="companyName">Company Name *</label>
            <input
              type="text"
              id="companyName"
              name="companyName"
              class="form-control"
              placeholder="e.g. Acme Technologies Ltd"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="fullName">Primary Contact Name *</label>
            <input
              type="text"
              id="fullName"
              name="fullName"
              class="form-control"
              placeholder="e.g. Sarah Jenkins"
              required
            />
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label class="form-label" for="email">Business Email *</label>
            <input
              type="email"
              id="email"
              name="email"
              class="form-control"
              placeholder="sarah@acme.com"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <input
              type="tel"
              id="phone"
              name="phone"
              class="form-control"
              placeholder="+91 98765 43210"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="At least 9 characters"
            required
            autocomplete="new-password"
          />
          <div class="password-meter">
            <div id="password-meter-bar" class="password-meter-bar"></div>
          </div>
          <div class="password-meter-text">
            <span id="password-feedback">Must include uppercase, lowercase, and special character</span>
            <span id="password-score"></span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="taxRegistrationNumber">Tax / GST Registration Number</label>
          <input
            type="text"
            id="taxRegistrationNumber"
            name="taxRegistrationNumber"
            class="form-control"
            placeholder="e.g. 29AAAAA0000A1Z5"
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="billingAddress">Billing Address</label>
          <textarea
            id="billingAddress"
            name="billingAddress"
            class="form-control"
            rows="2"
            placeholder="123 Corporate Way, Tech Hub..."
          ></textarea>
        </div>

        <button type="submit" id="register-btn" class="btn btn-primary btn-block">
          <span>Create Customer Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account?
        <a href="/login.html">Sign In</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/pages/register.js"></script>
</body>
</html>
